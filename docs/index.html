<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lead CRM · Off-Plate</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo" title="Off-Plate Lead CRM">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3l9 5v8l-9 5-9-5V8z"/><path d="M12 12l9-4M12 12v9M12 12L3 8"/>
      </svg>
    </div>
    <button class="nav-item active" title="Leads">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
    </button>
    <div class="spacer"></div>
    <button class="nav-item" title="Settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </aside>

  <div>
    <header class="header">
      <div class="crumbs">
        <span>Off-Plate</span>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        <span>Sales</span>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        <strong>Leads</strong>
      </div>
      <div class="header-actions">
        <div class="avatar">MF</div>
      </div>
    </header>

    <main class="main">
      <div class="page-title">
        <h1>Leads</h1>
        <span class="count mono" id="totalCount">0 total</span>
      </div>
      <div class="page-subtitle">Businesses from Google Maps without a website — scraped, filtered, and ready to contact.</div>

      <div class="metrics" id="metrics"></div>

      <div class="toolbar">
        <div class="tabs" id="tabs"></div>
        <div class="spacer"></div>
        <div class="search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="search" type="search" placeholder="Hledat jméno, kategorii, adresu…" />
        </div>
        <button class="btn btn-ghost" id="hideExternalBtn" title="Skrýt ty, co mají externí web">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3H2l8 9.5V19l4 2v-8.5L22 3z"/></svg>
          <span id="hideExternalLabel">Skrýt s externím webem</span>
        </button>
      </div>

      <div class="table-card">
        <table class="leads">
          <thead>
            <tr>
              <th>Jméno</th>
              <th>Kategorie</th>
              <th>Status</th>
              <th>Aktivita</th>
              <th>Hodnocení</th>
              <th>Telefon</th>
              <th>Adresa</th>
              <th>Maps</th>
            </tr>
          </thead>
          <tbody id="leadsBody"></tbody>
        </table>
        <div class="table-footer">
          <div>Showing <strong id="visibleCount" style="color:var(--text)">0</strong> of <strong id="totalCount2" style="color:var(--text)">0</strong> leads</div>
        </div>
      </div>
    </main>
  </div>
</div>

<div id="drawerRoot"></div>
<div id="toastRoot"></div>

<script type="module" src="app.js"></script>
</body>
</html>
